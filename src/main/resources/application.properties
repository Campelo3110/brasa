spring.application.name=brasa-de-rua
server.port=${TOTEM_PORTA:5000}
server.address=${TOTEM_HOST:127.0.0.1}
server.servlet.session.timeout=15m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${TOTEM_HTTPS:false}
server.error.whitelabel.enabled=false
spring.datasource.url=${TOTEM_SQL_URL:jdbc:sqlserver://localhost:1433;databaseName=Totem_Atendimento;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${TOTEM_SQL_USUARIO:totem_app}
spring.datasource.password=${TOTEM_SQL_SENHA:}
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5
totem.admin.senha=${TOTEM_ADMIN_SENHA:123}

